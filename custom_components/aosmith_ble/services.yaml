set_timed_mode:
  target:
    entity:
      integration: aosmith_ble
      domain: water_heater
  fields:
    mode:
      required: true
      selector:
        select:
          options:
            - electric
            - vacation
          translation_key: timed_mode
    days:
      required: true
      selector:
        number:
          min: 1
          max: 99
          step: 1
          mode: box
          unit_of_measurement: d
